name: Private S3 cache verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-cache-${{ github.ref }}
  cancel-in-progress: false
env:
  CACHE_KEY: private-s3-${{ github.run_id }}-${{ github.run_attempt }}
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
jobs:
  save:
    runs-on: [coder-small]
    timeout-minutes: 15
    outputs:
      workspace: ${{ steps.runner.outputs.workspace }}
    steps:
      - name: Verify adapter and create runtime diagnostics action
        id: runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CODER_RUNNER_WORKSPACE_ID"
          echo "workspace=$CODER_RUNNER_WORKSPACE_ID" >> "$GITHUB_OUTPUT"
          echo "Save workspace: $CODER_RUNNER_WORKSPACE_ID"
          systemctl is-active coder-cache-adapter.service
          curl --fail --silent http://127.0.0.1:6871/health
          test -z "${AWS_ACCESS_KEY_ID:-}${AWS_SECRET_ACCESS_KEY:-}${AWS_SESSION_TOKEN:-}"
          mkdir -p .cache-diagnostics
          cat > .cache-diagnostics/action.yml <<'ACTION'
          name: Cache runtime diagnostics
          description: Confirm the cache adapter and print non-secret token metadata
          runs:
            using: node24
            main: index.js
          ACTION
          cat > .cache-diagnostics/index.js <<'JS'
          const token = process.env.ACTIONS_RUNTIME_TOKEN;
          if (!token) throw new Error('Missing GitHub runtime token');
          const [head, body] = token.split('.').slice(0, 2).map(x => JSON.parse(Buffer.from(x, 'base64url')));
          console.log('Runtime token metadata:', JSON.stringify({algorithm:head.alg,key_id:head.kid,issuer:body.iss,audience:body.aud,repository_id:body.repository_id}));
          console.log('Results URL:', process.env.ACTIONS_RESULTS_URL);
          if (process.env.ACTIONS_RESULTS_URL !== 'http://127.0.0.1:6871/') throw new Error('Node wrapper did not redirect Results to the local adapter');
          JS
      - name: Inspect runtime metadata without logging credentials
        uses: ./.cache-diagnostics
      - name: Confirm small cache starts empty
        id: initial-small
        uses: actions/cache/restore@v5
        with:
          path: .cache-smoke/small
          key: ${{ env.CACHE_KEY }}-small
      - name: Confirm multipart cache starts empty
        id: initial-large
        uses: actions/cache/restore@v5
        with:
          path: .cache-smoke/large
          key: ${{ env.CACHE_KEY }}-large
      - name: Create small and 140 MiB incompressible fixtures
        env:
          SMALL_HIT: ${{ steps.initial-small.outputs.cache-hit }}
          LARGE_HIT: ${{ steps.initial-large.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SMALL_HIT" != true
          test "$LARGE_HIT" != true
          python3 - <<'PY'
          import os
          from pathlib import Path
          for size in ['small','large']:
              p=Path('.cache-smoke')/size
              p.mkdir(parents=True)
              (p/'origin').write_text(os.environ['CODER_RUNNER_WORKSPACE_ID'])
              with (p/'payload').open('wb') as f:
                  for _ in range(140 if size=='large' else 1): f.write(os.urandom(1024*1024 if size=='large' else 4096))
          PY
          (cd .cache-smoke/small && sha256sum payload origin > sha256)
          (cd .cache-smoke/large && sha256sum payload origin > sha256)
      - name: Save small cache
        uses: actions/cache/save@v5
        with:
          path: .cache-smoke/small
          key: ${{ env.CACHE_KEY }}-small
      - name: Save multipart cache
        uses: actions/cache/save@v5
        with:
          path: .cache-smoke/large
          key: ${{ env.CACHE_KEY }}-large
  restore:
    needs: save
    runs-on: [coder-small]
    timeout-minutes: 15
    steps:
      - name: Require a different, clean runner
        env:
          SAVE_WORKSPACE: ${{ needs.save.outputs.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Restore workspace: $CODER_RUNNER_WORKSPACE_ID"
          test -n "$SAVE_WORKSPACE"
          test "$SAVE_WORKSPACE" != "$CODER_RUNNER_WORKSPACE_ID"
          test ! -e .cache-smoke
          systemctl is-active coder-cache-adapter.service
          test -z "${AWS_ACCESS_KEY_ID:-}${AWS_SECRET_ACCESS_KEY:-}${AWS_SESSION_TOKEN:-}"
      - name: Restore small cache
        id: small
        uses: actions/cache/restore@v5
        with:
          path: .cache-smoke/small
          key: ${{ env.CACHE_KEY }}-small
          fail-on-cache-miss: true
      - name: Restore multipart cache
        id: large
        uses: actions/cache/restore@v5
        with:
          path: .cache-smoke/large
          key: ${{ env.CACHE_KEY }}-large
          fail-on-cache-miss: true
      - name: Verify exact hits and contents
        env:
          SMALL_HIT: ${{ steps.small.outputs.cache-hit }}
          LARGE_HIT: ${{ steps.large.outputs.cache-hit }}
          SAVE_WORKSPACE: ${{ needs.save.outputs.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SMALL_HIT" = true
          test "$LARGE_HIT" = true
          test "$(cat .cache-smoke/small/origin)" = "$SAVE_WORKSPACE"
          test "$(cat .cache-smoke/large/origin)" = "$SAVE_WORKSPACE"
          test "$(stat -c %s .cache-smoke/large/payload)" = 146800640
          (cd .cache-smoke/small && sha256sum --check sha256)
          (cd .cache-smoke/large && sha256sum --check sha256)
          echo 'Small and multipart caches restored with matching checksums on a fresh runner.'
          echo '### Private S3 cache verified' >> "$GITHUB_STEP_SUMMARY"
          echo "Exact small and 140 MiB multipart restores passed on workspace $CODER_RUNNER_WORKSPACE_ID." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify GitHub artifact passthrough
        uses: actions/upload-artifact@v4
        with:
          name: private-cache-checksums
          path: .cache-smoke/*/sha256
          retention-days: 1
